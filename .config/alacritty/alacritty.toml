[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
working_directory = "None"
live_config_reload = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 100, lines = 30 }
dynamic_padding = true
decorations = "Full"
opacity = 0.8
title = "Alacritty@CachyOS"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }
size = 12.0

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x101010"
foreground = "0xE0E0E0"

[colors.cursor]
text = "0x101010"
cursor = "0xE0E0E0"

[colors.vi_mode_cursor]
text = "0x101010"
cursor = "0xC8C8C8"

[colors.search.matches]
foreground = "0x151515"
background = "0xB0B0B0"

[colors.search.focused_match]
foreground = "0x101010"
background = "0xEEEEEE"

[colors.footer_bar]
foreground = "0xE0E0E0"
background = "0x303030"

[colors.hints.start]
foreground = "0x101010"
background = "0xC8C8C8"

[colors.hints.end]
foreground = "0x101010"
background = "0xC8C8C8"

[colors.selection]
text = "0xEEEEEE"
background = "0x4A4A4A"

[colors.normal]
black = "0x282828"
red = "0xCC6666"
green = "0xB5BD68"
yellow = "0xF0C674"
blue = "0x81A2BE"
magenta = "0xB294BB"
cyan = "0x8ABEB7"
white = "0xE5E5E5"

[colors.bright]
black = "0x666666"
red = "0xD54E53"
green = "0xB9CA4A"
yellow = "0xE7C547"
blue = "0x7AA6DA"
magenta = "0xC397D8"
cyan = "0x70C0BA"
white = "0xFFFFFF"

[colors.dim]
black = "0x282828"
red = "0x965050"
green = "0x77834C"
yellow = "0x99804A"
blue = "0x5D7890"
magenta = "0x80688A"
cyan = "0x628682"
white = "0xAAAAAA"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true
bindings = [
{ mouse = "Middle", mods = "None", action = "PasteSelection" },
]

[keyboard]
bindings = [
{ key = "Paste", mods = "None", action = "Paste" },
{ key = "Copy", mods = "None", action = "Copy" },
{ key = "L", mods = "Control", action = "ClearLogNotice" },
{ key = "L", mods = "Control", mode = "~Vi", chars = "\f" },
{ key = "PageUp", mods = "Shift", mode = "~Alt", action = "ScrollPageUp" },
{ key = "PageDown", mods = "Shift", mode = "~Alt", action = "ScrollPageDown" },
{ key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
{ key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },
{ key = "V", mods = "Control|Shift", action = "Paste" },
{ key = "C", mods = "Control|Shift", action = "Copy" },
{ key = "F", mods = "Control|Shift", action = "SearchForward" },
{ key = "B", mods = "Control|Shift", action = "SearchBackward" },
{ key = "C", mods = "Control|Shift", mode = "Vi", action = "ClearSelection" },
{ key = "Key0", mods = "Control", action = "ResetFontSize" },
]
